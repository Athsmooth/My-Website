<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="ZH5PNFO4dJELDd7PfxtxN9RpdTwmCu7uR3KBDm5VKlI" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/logo3.png">
    <link rel="preload" as="image" href="assets/logo3.png">
    <link rel="stylesheet" href="style.css">
    <n>
    <title>Pitch Perfect Challenge</title>
</head>
<body>
    <!-- Move these here! -->
    <div class="topnav"></div>
    <script src="navbar.js"></script>
    <div class="content">
        <div class="title">Pitch perfect</div>
        <div class="embed">
            <script src="pitchperfectgame.js" defer></script>
                    <div class="game-container">
            <div id="status-message"></div>
            <div class="controls">
                <button id="new-tone-btn" class="main-action-btn">New Tone</button>
            </div>
            </div>
            <br>
            <h2>Filter Allowed keys</h2>
            <br>
            <div class="note-selection">
                <button class="filter-btn active" data-note="C">C</button>
                <button class="filter-btn active" data-note="D">D</button>
                <button class="filter-btn active" data-note="E">E</button>
                <button class="filter-btn active" data-note="F">F</button>
                <button class="filter-btn active" data-note="G">G</button>
                <button class="filter-btn active" data-note="A">A</button>
                <button class="filter-btn active" data-note="B">B</button>
            </div>
            <div class="note-selection">
                <button class="filter-btn active" data-note="C#">C#</button>
                <button class="filter-btn active" data-note="D#">D#</button>
                <div class="placeholder-btn"></div>
                <button class="filter-btn active" data-note="F#">F#</button>
                <button class="filter-btn active" data-note="G#">G#</button>
                <button class="filter-btn active" data-note="A#">A#</button>
            </div>
            <div class="stats">
                Score: <span id="score-ratio">0/0</span> |
                Accuracy: <span id="accuracy">100</span>%
            </div>
            <div class="piano">
                <div class="key white" data-note="C4">C</div>
                <div class="key black" data-note="C#4">C#</div>
                <div class="key white" data-note="D4">D</div>
                <div class="key black" data-note="D#4">D#</div>
                <div class="key white" data-note="E4">E</div>
                <div class="key white" data-note="F4">F</div>
                <div class="key black" data-note="F#4">F#</div>
                <div class="key white" data-note="G4">G</div>
                <div class="key black" data-note="G#4">G#</div>
                <div class="key white" data-note="A4">A</div>
                <div class="key black" data-note="A#4">A#</div>
                <div class="key white" data-note="B4">B</div>
            </div>
            <br>
        </div>
        </div>
    </div>
</body>
